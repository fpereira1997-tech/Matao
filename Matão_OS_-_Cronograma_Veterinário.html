<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matão OS">
<title>Matão OS - Cronograma Veterinário</title>
<style>
:root{
  --bg:#000; --glass:rgba(30,30,30,.65); --glass-b:rgba(255,255,255,.1);
  --text:#F5F5F7; --muted:rgba(255,255,255,.55);
  --accent:#0A84FF; --danger:#FF453A; --success:#32D74B; --warning:#FFD60A;
  --c133:#BF5AF2; --c134:#FF9F0A;
}
[data-ic]{display:inline-flex;align-items:center;justify-content:center}
.ic{width:1em;height:1em;flex:none}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;position:fixed;inset:0;width:100%;height:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:10px}

.wallpaper{position:fixed;inset:0;z-index:0;background-color:#2a1b12;overflow:hidden;display:flex;align-items:center;justify-content:center}
.wallpaper svg.bg-scene{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.wallpaper .ext-bg{position:absolute;inset:0;background-image:url('Gemini_Generated_Image_i2a8iqi2a8iqi2a8.jfif'),url('fundo.jpg'),url('background.jpg');background-size:cover;background-position:center center;background-repeat:no-repeat;z-index:1}
.wallpaper::after{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 50% 48%,rgba(15,10,8,.18) 0%,rgba(15,10,8,.52) 100%),linear-gradient(180deg,rgba(15,10,8,.48) 0%,rgba(15,10,8,.22) 48%,rgba(15,10,8,.62) 100%);pointer-events:none}
.ambient{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15;animation:float 20s infinite ease-in-out alternate;z-index:1;pointer-events:none}
.l1{width:400px;height:400px;background:#0A84FF;top:-100px;left:-100px}
.l2{width:500px;height:500px;background:#C084FC;bottom:-150px;right:-100px;animation-delay:-5s}
@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}100%{transform:translate(0,0)}}

/* barra de status */
#status{position:absolute;top:0;left:0;right:0;height:46px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;background:linear-gradient(rgba(0,0,0,.65),transparent)}
#status .pill{display:inline-flex;gap:6px;align-items:center;background:rgba(20,20,22,.55);border:1px solid rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;cursor:default}
#status button.pill{cursor:pointer;transition:.2s}
#status button.pill:hover{background:rgba(40,40,45,.75)}
#status .mid{position:absolute;left:50%;transform:translateX(-50%);text-shadow:0 1px 4px rgba(0,0,0,.85)}

/* home */
#home{position:absolute;top:46px;left:0;right:0;bottom:110px;overflow-y:auto;padding:14px 40px 30px;z-index:10;display:flex;flex-direction:column;gap:34px}
.group-title{font-size:13px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;padding:6px 12px;background:rgba(20,20,22,.48);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:10px;margin-bottom:16px;display:inline-block;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.grid{display:flex;flex-wrap:wrap;gap:30px 34px}
.tile{position:relative;width:84px;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;color:inherit}
.tile .label{margin-top:8px;font-size:12px;font-weight:600;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.7);line-height:1.2}
.tile .sub{font-size:10.5px;color:#E5E5EA;text-shadow:0 1px 3px rgba(0,0,0,.9);margin-top:1px;font-weight:500}
.icon{width:68px;height:68px;border-radius:22.5%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;position:relative;overflow:hidden;box-shadow:0 8px 15px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.25,.1,.25,1);border:1px solid rgba(255,255,255,.06)}
.icon::after{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(rgba(255,255,255,.18),transparent);pointer-events:none}
.tile:hover .icon{transform:scale(1.06)}
.tile:active .icon{transform:scale(.94);filter:brightness(.8)}
.g-blue{background:linear-gradient(135deg,#0A84FF,#0056B3)}
.g-green{background:linear-gradient(135deg,#32D74B,#208A2E)}
.g-orange{background:linear-gradient(135deg,#FF9F0A,#B8730A)}
.g-purple{background:linear-gradient(135deg,#BF5AF2,#8A3BB3)}
.g-red{background:linear-gradient(135deg,#FF453A,#C92A2A)}
.g-gray{background:linear-gradient(135deg,#8E8E93,#48484A)}
.g-indigo{background:linear-gradient(135deg,#5E5CE6,#3634A3)}
.g-teal{background:linear-gradient(135deg,#64D2FF,#0A84FF)}

/* pasta */
.folder{background:rgba(255,255,255,.2);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.18)}
.folder::after{display:none}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;width:100%;height:100%}
.mini i{border-radius:5px;background:rgba(255,255,255,.14);display:block}
.mini i.on{background:rgba(255,255,255,.45)}
.mini i.done{background:var(--success)}
.mini i.today{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.mini i.sim{background:var(--warning)}
.mini i.prova{background:var(--danger)}
.badge{position:absolute;top:-6px;right:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:5}
.badge.ok{background:var(--success);color:#000}
.tile.now .icon{box-shadow:0 0 0 2px var(--accent),0 8px 15px rgba(0,0,0,.4)}

/* dock */
.dock{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 18px;background:var(--glass);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid var(--glass-b);border-radius:36px;display:flex;gap:16px;box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:40}
.dock .tile{width:62px}
.dock .icon{width:56px;height:56px;font-size:28px}
.dock .tile .tip{position:absolute;top:-42px;background:rgba(40,40,45,.9);backdrop-filter:blur(15px);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(8px);transition:.2s;border:1px solid var(--glass-b)}
.dock .tile:hover .tip{opacity:1;transform:none}
.dock .tile.active::after{content:"";position:absolute;bottom:-8px;width:5px;height:5px;border-radius:50%;background:#fff}

/* janela */
.window{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.94);width:min(900px,96vw);height:min(660px,84vh);background:rgba(28,28,30,.92);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border:1px solid rgba(255,255,255,.15);border-radius:18px;box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.16,1,.3,1);z-index:50;display:flex;flex-direction:column;overflow:hidden}
.window.active{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.window.full{width:100vw!important;height:100vh!important;top:0!important;left:0!important;transform:none!important;border-radius:0!important;border:0}
.whead{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.2);position:relative;min-height:46px}
.wl{display:flex;gap:8px;align-items:center;z-index:2}
.abtn{width:14px;height:14px;border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;border:0;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.abtn i{opacity:0;font-size:9px;transition:.2s}
.whead:hover .abtn i{opacity:1}
.b-close{background:#FF5F56;color:#4A0002}.b-exp{background:#27C93F;color:#004D09}
.wtitle{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;max-width:60%}
.wtitle b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtitle small{font-size:11px;color:var(--muted)}
.wbody{flex:1;overflow-y:auto;padding:20px;background:rgba(0,0,0,.1)}

/* conteúdo */
.sum{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.1)}
.sum p{flex:1;min-width:220px;color:#D1D1D6;font-size:13px;line-height:1.5}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--glass-b)}
.day{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:.2s}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.sim{background:rgba(255,214,10,.08);border-color:rgba(255,214,10,.3)}
.day.prova{background:rgba(255,69,58,.1);border-color:rgba(255,69,58,.35)}
.day.done .items{opacity:.5}
.dh{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;flex:none;transition:.2s;color:transparent;font-size:14px}
.day.done .chk{background:var(--success);border-color:var(--success);color:#000}
.dh .d{font-weight:700;font-size:14px}.dh .d::first-letter{text-transform:uppercase}
.dh .hrs{margin-left:auto;font-size:12px;color:var(--muted)}
.hoje{font-size:10px;font-weight:700;background:var(--accent);padding:2px 8px;border-radius:99px}
.item{padding:10px 14px 12px;border-top:1px solid rgba(255,255,255,.07)}
.tags{display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;background:var(--accent)}
.tag.c133{background:var(--c133)}.tag.c134{background:var(--c134);color:#000}
.subj{font-weight:600;font-size:13px}
.txt{font-size:13px;color:#D1D1D6;line-height:1.55;margin-bottom:8px}
.vids{display:flex;flex-wrap:wrap;gap:6px}
.vbtn{display:inline-flex;gap:7px;align-items:center;background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.35);color:#fff;padding:7px 11px;border-radius:10px;font-size:12px;cursor:pointer;text-align:left;transition:.2s}
.vbtn:hover{background:rgba(10,132,255,.28)}
.vbtn i{color:#64B5FF;font-size:15px}
.sbtn{display:inline-flex;gap:6px;align-items:center;border:1px dashed rgba(255,255,255,.25);color:var(--muted);padding:7px 11px;border-radius:10px;font-size:12px;text-decoration:none}
.sbtn:hover{color:#fff;border-color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px}

.box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:16px;margin-bottom:14px;font-size:13px;line-height:1.6;color:#D1D1D6}
.box h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
.box.warn{background:rgba(255,159,10,.08);border-color:rgba(255,159,10,.35)}
.box.warn h3{color:var(--c134)}
.box ul{padding-left:18px}.box li{margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid rgba(255,255,255,.1);padding:8px 6px;text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}

/* popup de vídeo */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:10000;display:none;align-items:center;justify-content:center;padding:14px;opacity:0;transition:opacity .2s}
.overlay.active{display:flex;opacity:1}
.vmodal{background:rgba(30,30,30,.96);backdrop-filter:blur(20px);border-radius:16px;border:1px solid var(--glass-b);width:min(920px,100%);max-height:96vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6);transform:scale(.96);transition:.2s cubic-bezier(.16,1,.3,1)}
.overlay.active .vmodal{transform:scale(1)}
.vhead{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--glass-b)}
.vhead b{flex:1;font-size:14px;font-weight:600}
.vframe{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.vframe iframe,.vframe #ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
.fb{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:#000 center/cover no-repeat}
.fb::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px)}
.fb>*{position:relative}
.fb .big{width:76px;height:76px;border-radius:50%;background:var(--danger);display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;border:0;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:.2s}
.fb .big:hover{transform:scale(1.07)}
.fb p{font-size:13px;color:#E5E5EA;max-width:520px;line-height:1.5}
.fb .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.vlist{padding:10px 16px 14px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--glass-b)}
.vlist .vbtn.cur{background:var(--accent);border-color:var(--accent)}
.vlist .vbtn.cur i{color:#fff}
.vfoot{padding:10px 16px 14px;font-size:11.5px;color:var(--muted);line-height:1.5}

.btn{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:0;color:#fff;text-decoration:none;background:rgba(255,255,255,.14);transition:.2s}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent)}
.btn.red{background:var(--danger)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.xbtn{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}

#alertOv{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:15000;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .2s}
#alertOv.active{display:flex;opacity:1}
.alertbox{width:min(300px,100%);background:rgba(44,44,46,.97);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:16px;text-align:center;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:scale(1.08);transition:transform .25s cubic-bezier(.16,1,.3,1)}
#alertOv.active .alertbox{transform:scale(1)}
.alertbody{padding:22px 18px 18px}
.alertico{width:46px;height:46px;border-radius:12px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;background:linear-gradient(135deg,#5E5CE6,#3634A3)}
.alerttitle{font-size:17px;font-weight:600;margin-bottom:6px}
.alertmsg{font-size:13px;line-height:1.45;color:#E5E5EA}
.alertbtns{display:flex;border-top:1px solid rgba(255,255,255,.15)}
.alertbtns button{flex:1;padding:13px 8px;background:transparent;border:0;color:var(--accent);font-size:17px;cursor:pointer}
.alertbtns button:hover{background:rgba(255,255,255,.07)}
.alertbtns button+button{border-left:1px solid rgba(255,255,255,.15);font-weight:600}
#toast{position:fixed;top:-100px;left:50%;transform:translateX(-50%);background:rgba(40,40,40,.92);backdrop-filter:blur(10px);border:1px solid var(--glass-b);border-radius:30px;padding:11px 22px;font-size:13.5px;font-weight:500;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:20000;transition:top .4s cubic-bezier(.16,1,.3,1);max-width:92vw}
#toast.show{top:48px}

/* ---------- Estilos do App Questões ---------- */
.q-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.q-field{display:flex;flex-direction:column;gap:6px}
.q-field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.q-select{appearance:none;-webkit-appearance:none;width:100%;background:rgba(255,255,255,.08) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23F5F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 12px center;border:1px solid rgba(255,255,255,.16);color:var(--text);padding:11px 36px 11px 13px;border-radius:12px;font-size:13.5px;font-weight:500;cursor:pointer;outline:none;transition:.2s}
.q-select:hover,.q-select:focus{border-color:var(--accent);background-color:rgba(255,255,255,.12)}
.q-select option{background:#1C1C1E;color:var(--text)}
.q-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.1)}
.q-toolbar-left,.q-toolbar-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.q-pill{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.q-pill:hover{background:rgba(255,255,255,.12)}
.q-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.q-pill small{opacity:.75;font-weight:500}
.q-syllabus{background:rgba(10,132,255,.08);border:1px solid rgba(10,132,255,.28);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.q-syllabus h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#64B5FF;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.q-syl-item{padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px;line-height:1.5;color:#E5E5EA}
.q-syl-item:first-of-type{border-top:0;padding-top:0}
.q-syl-meta{display:flex;gap:8px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
.q-syl-date{font-size:11px;color:var(--muted);font-weight:600}
.q-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;margin-bottom:14px}
.q-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.q-enun{font-size:14px;line-height:1.6;color:var(--text);margin-bottom:14px;white-space:pre-line}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:var(--text);font-size:13px;line-height:1.45;cursor:pointer;text-align:left;transition:.2s}
.q-opt:hover{background:rgba(255,255,255,.08)}
.q-opt .let{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.q-opt.correct{border-color:var(--success);background:rgba(50,215,75,.14)}
.q-opt.correct .let{background:var(--success);color:#000}
.q-opt.wrong{border-color:var(--danger);background:rgba(255,69,58,.14)}
.q-opt.wrong .let{background:var(--danger);color:#fff}
.q-comm{margin-top:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,.05);border-left:3px solid var(--accent);font-size:12.5px;line-height:1.55;color:#D1D1D6;display:none}
.q-comm.show{display:block}
.q-empty-box{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.18);border-radius:14px;padding:26px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.q-empty-box b{color:var(--text);display:block;font-size:14px;margin-bottom:6px}
.q-code{text-align:left;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11.5px;color:#A5A3FF;overflow-x:auto;margin-top:12px;line-height:1.45}

@media(max-width:700px){
  #home{padding:12px 18px 30px}
  .grid{gap:24px 18px}
  .window{width:100vw;height:calc(100vh - 0px);top:0;left:0;transform:scale(.96);border-radius:0;border:0}
  .window.active{transform:none}
  .dock{gap:10px;padding:10px 12px;max-width:96vw}
  .dock .tile{width:56px}.dock .icon{width:50px;height:50px;font-size:24px}
  #status .hide-m{display:none}
  .q-controls{grid-template-columns:1fr}
}
.icon .ic{width:1em;height:1em}
.icon.week{background:linear-gradient(135deg,#FFB020,#F08C00)}
.tile.complete .icon.week{background:linear-gradient(135deg,#32D74B,#208A2E)}
.num{font-size:38px;font-weight:700;color:#fff;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.badge.ok{background:#fff;color:#208A2E}
.rv{margin:0 14px 12px;border:1px solid rgba(94,92,230,.45);background:rgba(94,92,230,.12);border-radius:12px;padding:10px 12px}
.rvh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#A5A3FF;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.rvrow{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-top:1px solid rgba(255,255,255,.07);cursor:pointer;border-radius:8px}
.rvrow:first-of-type{border-top:0}
.rvrow:hover{background:rgba(255,255,255,.05)}
.rvrow .chk{width:20px;height:20px;font-size:12px;margin-top:1px}
.rvrow.done .chk{background:var(--success);border-color:var(--success);color:#000}
.rvrow.done .rvt{opacity:.45;text-decoration:line-through}
.rvn{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:#5E5CE6;color:#fff;flex:none;margin-top:2px}
.rvt{font-size:12.5px;color:#E5E5EA;line-height:1.45;flex:1}
.rvd{font-size:11px;color:var(--muted);display:block}
.rvgroup{margin-bottom:14px}
.rvgroup h4{font-size:12.5px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.rvgroup h4 small{color:var(--muted);font-weight:500}
.rvgroup.late h4{color:var(--danger)}
.rvgroup.now h4{color:#64B5FF}
.rvbox{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:6px 10px}
.badge .ic{width:12px;height:12px}
</style>

/* ---------- Normalização das matérias da semana para o App Questões ---------- */
const SKIP_SUBJ = new Set(["Inscrição","Organização","Revisão","Leitura leve","Descanso","PROVA","Questões"]);
function normalizeSubject(m){
  if(/^Específicos/i.test(m)) return "Específicos";
  if(/^SIMULADO/i.test(m)) return "Simulado";
  return m;
}
function getWeekSubjects(weekNum){
  const w = W.find(x => x.n === Number(weekNum));
  if(!w) return [];
  const map = new Map();
  w.days.forEach(d => {
    visItems(d).forEach(it => {
      if(SKIP_SUBJ.has(it.m)) return;
      const norm = normalizeSubject(it.m);
      if(!map.has(norm)) map.set(norm, []);
      map.get(norm).push({ date: d.d, rawSubj: it.m, cargo: it.c, text: it.t });
    });
  });
  // Caso o usuário tenha subido questões no JSON com uma matéria extra nessa semana, inclui também
  qBank.filter(q => Number(q.semana) === Number(weekNum)).forEach(q => {
    const norm = normalizeSubject(q.materia || "Geral");
    if(!map.has(norm)) map.set(norm, []);
  });
  return Array.from(map.entries()).map(([name, items]) => ({ name, items }));
}

/* ---------- Tentativa automática de puxar ./questoes.json do servidor ---------- */
async function autoFetchQuestionsJson(silent = true){
  if(!/^https?:$/.test(location.protocol)){
    if(!silent) toast("Abra via http:// ou use 'Importar .json' para carregar do computador", "info");
    return;
  }
  try{
    const res = await fetch("./questoes.json?t=" + Date.now(), { cache: "no-store" });
    if(!res.ok) throw new Error("Não encontrado");
    const data = await res.json();
    const list = Array.isArray(data) ? data : (Array.isArray(data.questoes) ? data.questoes : null);
    if(list){
      qBank = list;
      store.set("matao_qbank", qBank);
      if(!silent) toast(qBank.length + " questões sincronizadas de questoes.json!");
      if(openApp === "questoes") refreshWindow();
      renderHome();
    }
  }catch(e){
    if(!silent) toast("Arquivo questoes.json ainda não encontrado na pasta do servidor", "info");
  }
}

/* ---------- revisão espaçada ---------- */
const RV_INT = [1,7,21];            // dias após o estudo
const RV_LAST = "2026-12-04";       // última data com revisão (05/12 é descanso)
const RV_SKIP = new Set(["Inscrição","Diagnóstico","Organização","Questões","Revisão","Leitura leve","Descanso","PROVA","Matemática e Informática"]);
const addDays = (iso,n) => { const d = parse(iso); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const shortDate = iso => parse(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
function topicLabel(it){
  let s = it.t.replace(/^\d+h(?:\d+)?:\s*/,"").split(/\.\s(?=[A-ZÁÉÍÓÚÂÊÔÃÕ(])/)[0].replace(/\.$/,"");
  if(s.length>120) s = s.slice(0,117)+"...";
  return it.m.split(":")[0] + ": " + s;
}
const REVIEWS = (()=>{
  const out = [];
  W.forEach(w => w.days.forEach((day,di) => day.items.forEach((it,ii) => {
    if(RV_SKIP.has(it.m) || /^SIMULADO/.test(it.m)) return;
    RV_INT.forEach((n,k) => {
      const date = addDays(day.d, n);
      if(date > RV_LAST) return;
      out.push({date, n:k+1, c:it.c, label:topicLabel(it), from:day.d, key:date+"|"+w.n+"."+di+"."+ii+"|"+(k+1)});
    });
  })));
  return out.sort((a,b) => a.date.localeCompare(b.date) || a.n-b.n);
})();
const rvVisible = r => cargo==="both" || r.c==="both" || r.c===cargo;
const rvOn = date => REVIEWS.filter(r => r.date===date && rvVisible(r));
function rvRow(r){

}

function showWindow(title, sub, html){
  $("#wTitle").textContent = title; $("#wSub").textContent = sub; $("#wBody").innerHTML = html;
  $("#win").classList.add("active"); $("#wBody").scrollTop = 0; hydrate($("#wBody"));
}
function closeWindow(){ $("#win").classList.remove("active","full"); openWeek = null; openApp = null; }

function folderHTML(w){
  const days = visDays(w); const today = todayISO();
  const hrs = days.reduce((a,d)=>a+hoursOf(d.h),0);
  const fin = days.filter(d => done[d.d]).length;
  let html = '<div class="sum"><p>'+esc(w.goal)+'</p><span class="chip">'+ic("clock")+' '+(Math.round(hrs*10)/10).toString().replace(".",",")+'h</span><span class="chip">'+ic("check-circle")+' '+fin+'/'+days.length+'</span></div>';
  if(!days.length) return html + '<div class="empty">Nenhuma sessão desta semana para o cargo selecionado.</div>';
  days.forEach(day => {
    const cls = "day"+(day.d===today?" today":"")+(day.sp?" "+day.sp:"")+(done[day.d]?" done":"");
    html += '<div class="'+cls+'"><div class="dh" data-day="'+day.d+'"><div class="chk">'+ic("check")+'</div><span class="d">'+esc(fmtDay.format(parse(day.d)))+'</span>'+(day.d===today?'<span class="hoje">HOJE</span>':'')+'<span class="hrs">'+day.h+'</span></div><div class="items">';
    visItems(day).forEach(it => {
      const tag = it.c==="both" ? "Comum 134 e 133" : (it.c==="134" ? "Sanitarista 134" : "Complemento 133");
      html += '<div class="item"><div class="tags"><span class="tag c'+it.c+'">'+tag+'</span><span class="subj">'+esc(it.m)+'</span></div><p class="txt">'+esc(it.t)+'</p><div class="vids">';
      (it.v||[]).forEach((k,i,arr) => { html += '<button class="vbtn" data-keys="'+arr.join(",")+'" data-i="'+i+'">'+ic("play-circle")+''+esc(V[k].t)+'</button>'; });
      (it.q||[]).forEach(q => { html += '<a class="sbtn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(q)+'">'+ic("magnifying-glass")+'Buscar: '+esc(q)+'</a>'; });
      html += '</div></div>';
    });
    html += '</div>';
    html += '</div>';
  });
  return html;
}
function openFolder(n){
  const w = W.find(x => x.n===n); openWeek = n; openApp = null;
  const days = visDays(w);
  const first = days[0] ? parse(days[0].d) : null, last = days[days.length-1] ? parse(days[days.length-1].d) : null;
  const f = d => d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  const sub = (first ? f(first)+" a "+f(last)+" · " : "") + (cargo==="both" ? "134 e 133" : "cargo "+cargo);
  showWindow("Semana "+n+" · "+w.name.replace(/^Semana \d+:\s*/,""), sub, folderHTML(w));
}
function refreshWindow(){
  if(openWeek!==null){ refreshFolder(); return; }
  if(openApp && APPS[openApp]){
    const st = $("#wBody").scrollTop;
    const r = APPS[openApp]();
    $("#wTitle").textContent = r[0];
    $("#wSub").textContent = r[1];
    $("#wBody").innerHTML = r[2];
    $("#wBody").scrollTop = st;
    hydrate($("#wBody"));
  }
}
function refreshFolder(){
  if(openWeek===null) return;
  const w = W.find(x => x.n===openWeek), st = $("#wBody").scrollTop;
  $("#wBody").innerHTML = folderHTML(w); $("#wBody").scrollTop = st; hydrate($("#wBody"));
}

/* ---------- Construção do App Questões ---------- */
function buildQuestoesHTML(){
  const wNum = Number(qFilter.week);
  const wObj = W.find(x => x.n === wNum) || W[0];
  const subjects = getWeekSubjects(wNum);

  // Garante que a matéria selecionada exista na semana atual
  if(qFilter.subj !== "ALL" && !subjects.some(s => s.name === qFilter.subj)){
    qFilter.subj = "ALL";
  }

  // 1. Barra de ações para JSON
  let h = '<div class="q-toolbar">';
  h += '<div class="q-toolbar-left">';
  h += '<span class="chip">'+ic("list-checks")+' '+qBank.length+' questões no banco</span>';
  h += '</div>';
  h += '<div class="q-toolbar-right">';
  h += '<button class="btn sm primary" id="btnImportJson">'+ic("upload")+' Importar .json</button>';
  h += '<button class="btn sm" id="btnFetchJson">'+ic("repeat")+' Ler questoes.json</button>';
  h += '<button class="btn sm" id="btnDownloadTpl">'+ic("download")+' Modelo .json</button>';
  h += '</div></div>';

  // 2. Combobox de Semana e Combobox de Matéria
  h += '<div class="q-controls">';
  h += '<div class="q-field"><label for="qWeekSel">1. Selecione a Semana</label><select class="q-select" id="qWeekSel">';
  W.forEach(w => {
    const first = w.days[0] ? shortDate(w.days[0].d) : "";
    const last  = w.days[w.days.length-1] ? shortDate(w.days[w.days.length-1].d) : "";
    h += '<option value="'+w.n+'"'+(w.n===wNum?' selected':'')+'>'+esc(w.name)+' ('+first+' a '+last+')</option>';
  });
  h += '</select></div>';

  h += '<div class="q-field"><label for="qSubjSel">2. Escolha a Matéria da Semana</label><select class="q-select" id="qSubjSel">';
  const totalSyllabusItems = subjects.reduce((a,s)=>a+s.items.length, 0);
  h += '<option value="ALL"'+(qFilter.subj==="ALL"?' selected':'')+'>Todas as matérias da Semana '+wNum+' ('+totalSyllabusItems+' tópicos)</option>';
  subjects.forEach(s => {
    const qCnt = qBank.filter(q => Number(q.semana)===wNum && normalizeSubject(q.materia)===s.name).length;
    const suffix = qCnt ? ' · '+qCnt+' quest'+(qCnt===1?'ão':'ões') : '';
    h += '<option value="'+esc(s.name)+'"'+(qFilter.subj===s.name?' selected':'')+'>'+esc(s.name)+' ('+s.items.length+' aula'+(s.items.length===1?'':'s')+suffix+')</option>';
  });
  h += '</select></div>';
  h += '</div>';

  // 3. Pílulas de acesso rápido para a matéria abaixo das comboboxes
  if(subjects.length){
    h += '<div class="q-pills">';
    h += '<button class="q-pill'+(qFilter.subj==="ALL"?' active':'')+'" data-qsubj="ALL">Todas <small>('+totalSyllabusItems+')</small></button>';
    subjects.forEach(s => {
      h += '<button class="q-pill'+(qFilter.subj===s.name?' active':'')+'" data-qsubj="'+esc(s.name)+'">'+esc(s.name)+' <small>('+s.items.length+')</small></button>';
    });
    h += '</div>';
  }

  // 4. Painel com o Conteúdo Programático Imediato da Semana + Matéria escolhida
  const activeSubjects = qFilter.subj === "ALL" ? subjects : subjects.filter(s => s.name === qFilter.subj);
  h += '<div class="q-syllabus">';
  h += '<h4>'+ic("book-open")+' Conteúdo da '+esc(wObj.name)+(qFilter.subj!=="ALL" ? ' · '+esc(qFilter.subj) : '')+'</h4>';
  const flatTopics = [];
  activeSubjects.forEach(s => s.items.forEach(it => flatTopics.push({ subj: s.name, ...it })));
  if(!flatTopics.length){
    h += '<div class="q-syl-item">Nenhum tópico teórico listado para este filtro nesta semana.</div>';
  } else {
    flatTopics.forEach(tp => {
      const tag = tp.cargo==="both" ? "Comum 134/133" : (tp.cargo==="134" ? "Sanitarista 134" : "Complemento 133");
      h += '<div class="q-syl-item">';
      h += '<div class="q-syl-meta"><span class="tag c'+tp.cargo+'">'+tag+'</span><span class="subj">'+esc(tp.rawSubj)+'</span><span class="q-syl-date">'+shortDate(tp.date)+'</span></div>';
      h += '<div>'+esc(tp.text)+'</div>';
      h += '</div>';
    });
  }
  h += '</div>';

  // 5. Listagem das Questões filtradas do JSON para a Semana e Matéria
  const filteredQs = qBank.filter(q => {
    const matchWeek = Number(q.semana) === wNum;
    const matchSubj = qFilter.subj === "ALL" || normalizeSubject(q.materia||"") === qFilter.subj;
    const matchCargo = cargo === "both" || !q.cargo || q.cargo === "both" || q.cargo === cargo;
    return matchWeek && matchSubj && matchCargo;
  });

  if(!filteredQs.length){
    h += '<div class="q-empty-box">';
    h += '<b>Nenhuma questão carregada para '+(qFilter.subj==="ALL" ? 'a Semana '+wNum : esc(qFilter.subj)+' na Semana '+wNum)+'</b>';
    h += 'Quando quiser anexar as questões da semana, basta subir o arquivo <code>questoes.json</code> na mesma pasta da hospedagem (ou clicar em <b>Importar .json</b> acima).';
    h += '<pre class="q-code">[\n  {\n    "id": "s'+wNum+'_q1",\n    "semana": '+wNum+',\n    "materia": "'+(qFilter.subj==="ALL" ? (subjects[0]?subjects[0].name:"SUS") : qFilter.subj)+'",\n    "cargo": "both",\n    "enunciado": "Texto da questão...",\n    "alternativas": ["A) ...", "B) ...", "C) ...", "D) ..."],\n    "correta": 0,\n    "comentario": "Gabarito comentado..."\n  }\n]</pre>';
    h += '</div>';
  } else {
    filteredQs.forEach((q, idx) => {
      const qid = q.id || ("w"+wNum+"_"+idx);
      const ans = qAns[qid];
      const hasAnswered = ans !== undefined;
      const tagCargo = (!q.cargo || q.cargo==="both") ? "Comum 134 e 133" : (q.cargo==="134" ? "Sanitarista 134" : "Complemento 133");
      h += '<div class="q-card">';
      h += '<div class="q-card-head"><div class="tags" style="margin:0"><span class="tag c'+(q.cargo||"both")+'">'+tagCargo+'</span><span class="subj">'+esc(q.materia||"Questão")+'</span></div><span class="chip">#'+(idx+1)+'</span></div>';
      h += '<div class="q-enun">'+esc(q.enunciado||"")+'</div>';
      h += '<div class="q-opts">';
      (q.alternativas||[]).forEach((alt, ai) => {
        const letChar = String.fromCharCode(65 + ai);
        const cleanAlt = String(alt).replace(/^[A-E]\)\s*/i, "");
        let cls = "q-opt";
        if(hasAnswered){
          if(ai === Number(q.correta)) cls += " correct";
          else if(ai === Number(ans)) cls += " wrong";
        }
        h += '<button class="'+cls+'" data-qid="'+esc(qid)+'" data-opt="'+ai+'"><span class="let">'+letChar+'</span><span>'+esc(cleanAlt)+'</span></button>';
      });
      h += '</div>';
      if(q.comentario){
        h += '<div class="q-comm'+(hasAnswered?' show':'')+'"><b>Comentário:</b> '+esc(q.comentario)+'</div>';
      }
      h += '</div>';
    });
  }

  return ["App Questões", "Semana "+wNum+" · "+(qFilter.subj==="ALL"?"Todas as matérias":qFilter.subj), h];
}

function openApp_(id){
  openApp = id; openWeek = null;
  if(id === "questoes"){
    // Seleciona por padrão a semana correspondente à data de hoje, se aplicável
    const today = todayISO();
    const curW = W.find(w => w.days.some(d => d.d === today));
    if(curW && qFilter.week === undefined) qFilter.week = curW.n;
  }
  const [t,s,h] = APPS[id]();
  showWindow(t,s,h);
}

/* ---------- popup de vídeo ---------- */
let player = null, vState = {keys:[],i:0}, vTimer = null;
const canEmbed = /^https?:$/.test(location.protocol);

function loadYT(){
  if(window.YT && YT.Player) return Promise.resolve(true);
  if(loadYT._p) return loadYT._p;
  loadYT._p = new Promise(res => {
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api";
    window.onYouTubeIframeAPIReady = () => res(true);
    s.onerror = () => res(false); document.head.appendChild(s);
    setTimeout(() => res(!!(window.YT && YT.Player)), 7000);
  });
  return loadYT._p;
}
function destroyPlayer(){
  clearTimeout(vTimer);
  try{ if(player && player.destroy) player.destroy(); }catch(e){}
  player = null;
  const wrap = $(".vframe"), old = $("#ytp"); if(old) old.remove();
  const n = document.createElement("div"); n.id = "ytp"; wrap.insertBefore(n, wrap.firstChild);
}
function showFallback(v, reason){
  clearTimeout(vTimer);
  try{ if(player && player.destroy) player.destroy(); }catch(e){} player = null;
  const ytp = $("#ytp"); if(ytp) ytp.style.display = "none";
  const fb = $("#fb"); fb.style.display = "flex";
  fb.style.backgroundImage = v.id ? 'url("https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg")' : "linear-gradient(135deg,#2C2C2E,#1C1C1E)";
  $("#fbMsg").textContent = reason;
  $("#fbTab").href = watchUrl(v);
}
function openPopupWindow(v){
  const w = 1040, h = 640, l = Math.max(0,(screen.width-w)/2), t = Math.max(0,(screen.height-h)/2);
  const win = window.open(watchUrl(v), "ytpopup", "popup=yes,width="+w+",height="+h+",left="+l+",top="+t+",resizable=yes,scrollbars=yes");
  if(!win){ toast("Popup bloqueado pelo navegador, abrindo em nova aba", "warning"); window.open(watchUrl(v), "_blank", "noopener"); }
  else { try{ win.focus(); }catch(e){} }
}
async function playVideo(v){
  destroyPlayer();
  $("#fb").style.display = "none";
  $("#fbTab").href = watchUrl(v);
  if(!canEmbed){
    showFallback(v, "Este arquivo está aberto direto do computador (file://). Nesse modo o YouTube bloqueia o player embutido (erro 153). Use a janela popup abaixo, ou abra o arquivo por um endereço http (ver dica no rodapé) para assistir aqui dentro.");
    return;
  }
  const ok = await loadYT();
  if(!ok){ showFallback(v, "Não foi possível carregar o player do YouTube (sem internet ou bloqueado). Use a janela popup abaixo."); return; }
  if(v !== vState.cur) return;
  let ready = false;
  const cfg = {
    host: "https://www.youtube-nocookie.com", width:"100%", height:"100%",
    playerVars: {rel:0, playsinline:1, autoplay:1, origin: location.origin},
    events: {
      onReady: () => { ready = true; clearTimeout(vTimer); },
      onError: e => {
        const c = e && e.data;
        const msg = (c===101 || c===150) ? "O autor deste vídeo não permite a reprodução fora do YouTube. Use a janela popup abaixo."
                  : (c===153) ? "O YouTube recusou o player embutido (erro 153, falta de referência da página). Use a janela popup abaixo."
                  : (c===100) ? "Este vídeo foi removido ou está privado. Use o botão de busca do item para achar outro."
                  : "O player não conseguiu reproduzir este vídeo (erro "+c+"). Use a janela popup abaixo.";
        showFallback(v, msg);
      }
    }
  };
  if(v.pl){ cfg.playerVars.listType = "playlist"; cfg.playerVars.list = v.pl; } else { cfg.videoId = v.id; }
  try{ player = new YT.Player("ytp", cfg); }catch(e){ showFallback(v, "Falha ao iniciar o player. Use a janela popup abaixo."); return; }
  vTimer = setTimeout(() => { if(!ready) showFallback(v, "O player demorou demais para responder. Use a janela popup abaixo."); }, 9000);
}
function openVideo(keys, i){
  const v = V[keys[i]]; vState = {keys, i, cur:v};
  $("#vTitle").textContent = v.t;
  $("#vList").innerHTML = keys.length>1 ? keys.map((k,j) => '<button class="vbtn'+(j===i?' cur':'')+'" data-keys="'+keys.join(",")+'" data-i="'+j+'">'+ic("play-circle")+''+esc(V[k].t)+'</button>').join("") : "";
  $("#vList").style.display = keys.length>1 ? "flex" : "none";
  $("#vFoot").innerHTML = canEmbed ? "Se o vídeo não carregar aqui dentro, aparece automaticamente o botão para assistir em janela popup." :
    "Dica: para assistir dentro da página, abra este arquivo por um endereço http. No computador, abra o terminal na pasta do arquivo e rode <b>python -m http.server 8000</b>, depois acesse <b>http://localhost:8000</b>.";
  $("#vOverlay").classList.add("active");
  playVideo(v);
}
function closeVideo(){
  if(!$("#vOverlay").classList.contains("active")) return;
  $("#vOverlay").classList.remove("active");
  destroyPlayer(); $("#fb").style.display = "none"; vState.cur = null;
}

/* ---------- eventos ---------- */
document.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "qWeekSel"){
    qFilter.week = Number(t.value);
    qFilter.subj = "ALL";
    refreshWindow();
    return;
  }
  if(t.id === "qSubjSel"){
    qFilter.subj = t.value;
    refreshWindow();
    return;
  }
  if(t.id === "qFileInput"){
    const file = t.files && t.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const parsed = JSON.parse(ev.target.result);
        const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.questoes) ? parsed.questoes : null);
        if(!list) throw new Error("Formato inválido");
        qBank = list;
        store.set("matao_qbank", qBank);
        renderHome();
        refreshWindow();
        toast(qBank.length + " questões importadas com sucesso!");
      }catch(err){
        toast("Erro ao ler o arquivo .json. Verifique a formatação.", "warning");
      }
      t.value = "";
    };
    reader.readAsText(file);
    return;
  }
});

document.addEventListener("click", e => {
  const t = e.target;
  const wk = t.closest("[data-week]"); if(wk){ openFolder(Number(wk.dataset.week)); return; }
  const ap = t.closest("[data-app]"); if(ap){ openApp_(ap.dataset.app); return; }
  const dk = t.closest("[data-dock]");
  if(dk){
    const c = dk.dataset.dock;
    if(c === "hoje"){
      const today = todayISO(); let n = W.find(w => w.days.some(d => d.d===today));
      if(!n){ n = todayISO() < W[0].days[0].d ? W[0] : W[W.length-1]; toast("Hoje está fora do período do plano", "info"); }
      openFolder(n.n);
    } else if(c === "questoes"){
      openApp_("questoes");
    } else {
      cargo = (cargo===c) ? "both" : c; store.set("matao_cargo", cargo); renderHome();
      if(openWeek!==null) openFolder(openWeek);
      if(openApp==="questoes") refreshWindow();
      toast(cargo==="134" ? "Mostrando o Sanitarista (134) e o conteúdo comum" : "Mostrando todo o conteúdo", "funnel");
    }
    return;
  }
  // Eventos internos do App Questões
  const qp = t.closest("[data-qsubj]");
  if(qp){ qFilter.subj = qp.dataset.qsubj; refreshWindow(); return; }
  if(t.closest("#btnImportJson")){ $("#qFileInput").click(); return; }
  if(t.closest("#btnFetchJson")){ autoFetchQuestionsJson(false); return; }
  if(t.closest("#btnDownloadTpl")){ downloadTemplateJson(); return; }
  const qOpt = t.closest(".q-opt[data-qid]");
  if(qOpt){
    const qid = qOpt.dataset.qid;
    const optIdx = Number(qOpt.dataset.opt);
    qAns[qid] = optIdx;
    store.set("matao_qans", qAns);
    refreshWindow();
    return;
  }

  const vb = t.closest(".vbtn[data-keys]"); if(vb){ openVideo(vb.dataset.keys.split(","), Number(vb.dataset.i)); return; }
  const rr = t.closest("[data-rv]");
  if(rr){ const k = rr.dataset.rv; if(rvDone[k]) delete rvDone[k]; else rvDone[k] = true; store.set("matao_rv", rvDone); renderHome(); refreshWindow(); return; }
  const dh = t.closest(".dh[data-day]");
  if(dh){ const d = dh.dataset.day; if(done[d]) delete done[d]; else done[d] = true; store.set("matao_done", done); renderHome(); refreshFolder(); return; }
  if(t.id==="wClose" || t.closest("#wClose")){ closeWindow(); return; }
  if(t.closest("#wExp")){ $("#win").classList.toggle("full"); return; }
  if(t.closest("#vClose") || t.id==="vOverlay"){ closeVideo(); return; }
  if(t.closest("#fbPlay") || t.closest("#fbPop")){ if(vState.cur) openPopupWindow(vState.cur); return; }
  if(t.closest("#fbCopy")){
    const url = vState.cur ? watchUrl(vState.cur) : "";
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast("Link copiado")).catch(() => { prompt("Copie o link:", url); });
    return;
  }
});
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if($("#alertOv").classList.contains("active")) closeAlert(false); else if($("#vOverlay").classList.contains("active")) closeVideo(); else closeWindow();
});

function tick(){
  const n = new Date();
  $("#clock").textContent = n.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  $("#dProva").textContent = Math.max(0, Math.round((parse("2026-12-06") - t0)/86400000));
}
function rvCounts(){
  const today = todayISO(), vis = REVIEWS.filter(r => r.date<=today && !rvDone[r.key]);
  return {late: vis.filter(r => r.date<today).length, now: vis.filter(r => r.date===today).length};
}
function maybeAlert(){
  const today = todayISO();
  if(today > "2026-12-06") return;
  const c = rvCounts(), n = c.late + c.now;
  if(!n) return;
  if(store.get("matao_alert","") === today + ":" + n) return;       // já avisou hoje com esse mesmo número
  $("#alertTitle").textContent = "Revisão espaçada de hoje";
  $("#alertMsg").textContent = "Faça primeiro a revisão antes de estudar hoje. Você tem " + n + (n===1 ? " revisão pendente" : " revisões pendentes") + (c.late ? " (" + c.late + (c.late===1 ? " atrasada" : " atrasadas") + ")" : "") + ", cerca de " + (n*10) + " minutos.";
  $("#alertOv").classList.add("active");
}
function closeAlert(go){
  const c = rvCounts(); store.set("matao_alert", todayISO() + ":" + (c.late + c.now));
  $("#alertOv").classList.remove("active");
  if(go) openApp_("revisao");
}
$("#alertLater").addEventListener("click", () => closeAlert(false));
$("#alertGo").addEventListener("click", () => closeAlert(true));
tick(); setInterval(tick, 30000);
renderHome(); hydrate();
autoFetchQuestionsJson(true);
setTimeout(maybeAlert, 500);
</script>
</body>
</html>
